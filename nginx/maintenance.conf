# ==========================================
# Frontend: maintenance.pydah.edu.in
# ==========================================
server {
    listen 80;
    server_name maintenance.pydah.edu.in;

    root /var/www/maintanance;
    index index.html;

    client_max_body_size 50M;

    # Frontend routes - SPA handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fallback API proxy if frontend domain receives /api requests
    location /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# Backend API: maintenance-backend.pydah.edu.in
# ==========================================
server {
    listen 80;
    server_name maintenance-backend.pydah.edu.in;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
