<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Campo — Submit, track, and resolve campus maintenance and support requests." />

    <title>Campo — Support &amp; Maintenance Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Favicons & App Icons -->
    <link rel="icon" href="/campo-logos/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/campo-logos/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/campo-logos/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/campo-logos/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Campo" />
    <meta property="og:title" content="Campo — Support &amp; Maintenance Portal" />
    <meta property="og:description" content="Submit, track, and resolve campus maintenance and support requests." />
    <meta property="og:image" content="/campo-logos/og-image.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Campo — Support &amp; Maintenance Portal" />
    <meta name="twitter:description" content="Submit, track, and resolve campus maintenance and support requests." />
    <meta name="twitter:image" content="/campo-logos/og-image.png" />
    <script>
      (() => {
        const isLocalHost = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
        const themeServer = isLocalHost
          ? 'http://localhost:7000'
          : 'https://ui-theme.pydah.edu.in';
        const loader = document.createElement('script');

        loader.src = `${themeServer}/themes/theme-loader.js`;
        loader.dataset.themeServer = themeServer;
        loader.dataset.pollInterval = isLocalHost ? '10' : '30';
        document.head.appendChild(loader);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: var(--background, #FAFAF5);
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
